# Publica a app no GitHub Pages (ramo gh-pages) sempre que há alterações.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main, claude/personal-management-app-hsbue3]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Preparar ficheiros da app
        run: |
          mkdir -p _site
          cp index.html styles.css app.js sync.js sw.js manifest.webmanifest icon.svg _site/
          touch _site/.nojekyll

      - name: Publicar no ramo gh-pages
        working-directory: _site
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publicar ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: Ligar o GitHub Pages ao ramo gh-pages (se ainda não estiver)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "GitHub Pages já está ligado."
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" -f "source[branch]=gh-pages" -f "source[path]=/" \
              || echo "::warning::Liga o Pages em Settings → Pages → Branch: gh-pages / (root)."
          fi
          echo "App: https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
